[project]
name = "worker"
version = "0.1.0"
description = "Job processor for the web app queue"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[project.scripts]
worker = "worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
