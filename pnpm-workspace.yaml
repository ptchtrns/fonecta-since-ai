packages:
  - apps/*
  - packages/*

# Vite+ ships its own Vite core and Vitest; every package must resolve the same copies.
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Solid 2 and better-auth release in lockstep bursts; fresh versions should install immediately.
minimumReleaseAgeExclude:
  - solid-js
  - '@solidjs/*'
  - filesystem-routing
  - better-auth
  - '@better-auth/*'

allowBuilds:
  '@solidjs/compiler': true
  esbuild: true
  sharp: true
  workerd: true

# Router fix (still unfixed in next.44): a preloaded query entry is never promoted, so every read during the
# navigation bumps its version. The dashboard layout and page both read `workspace`, re-ran each other forever and
# froze the tab when arriving from the landing page's "Open Connecta AI". Drop the patch once upstream fixes it.
patchedDependencies:
  '@solidjs/router@2.0.0-next.43': patches/@solidjs__router@2.0.0-next.43.patch
